<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scribble Clone Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Scribble Clone <span>🎨</span></h1>
      <p>Draw & Guess Game (Hotseat Version)</p>
    </header>
    <main>
      <section id="game-area">
        <canvas id="board" width="600" height="400"></canvas>
        <div id="tools">
          <input type="color" id="colorPicker" value="#111111"/>
          <input type="range" id="brushSize" min="2" max="20" value="4"/>
          <button id="clearBtn">🧹 Clear</button>
        </div>
        <div id="hint"></div>
        <div id="timer"></div>
      </section>
      <section id="controls">
        <button id="startBtn">Start New Game</button>
        <input type="text" id="guessInput" placeholder="Your guess..." autocomplete="off" disabled />
        <button id="guessBtn" disabled>Guess!</button>
      </section>
      <section id="status">
        <div id="results"></div>
      </section>
    </main>
  </div>
  <footer>
    <p>By xnkit69 · Deployed on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
